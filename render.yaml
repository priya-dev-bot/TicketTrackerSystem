# Render Blueprint for the BACKEND (Socket.IO needs a persistent Node server, so use a Web Service).
# Secrets (sync: false) are entered in the Render dashboard - they are NOT stored in this file.
services:
  - type: web
    name: instaport-support-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false   # e.g. https://your-app.vercel.app  (no trailing slash)
